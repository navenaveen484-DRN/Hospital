<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hcBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hcCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="hcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#hcBlueGrad)" filter="url(#hcGlow)"/>
  <!-- Outer Glass Border -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2"/>
  <!-- Medical Cross Horizontal -->
  <rect x="26" y="46" width="68" height="28" rx="7" fill="url(#hcCrossGrad)"/>
  <!-- Medical Cross Vertical -->
  <rect x="46" y="26" width="28" height="68" rx="7" fill="url(#hcCrossGrad)"/>
  <!-- Center Vital Pulse Line -->
  <path d="M38 60h9l4-7 5 14 5-9 4 2h17" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
